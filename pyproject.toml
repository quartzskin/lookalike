[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lookalike"
version = "0.1.0"
description = "Offline checker for lookalike links, domains and QR codes"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
lookalike = "lookalike.cli:main"

[tool.setuptools]
packages = ["lookalike"]

[tool.setuptools.package-data]
lookalike = ["web/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E741", "E731", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
